  <text x="864" y="84" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="end">15 merged / 46 opened</text>
  <rect x="36" y="94" width="828" height="6" rx="3" fill="#161d27"/>
  <rect class="grow b0" x="36" y="94" width="270.0" height="6" rx="3" fill="#58a6ff"/>

  <text x="36" y="128" fill="#6e7681" font-size="11" letter-spacing="1.5">ISSUES CLOSED</text>
  <text x="864" y="128" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="end">13 closed / 35 filed</text>
